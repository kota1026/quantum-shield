[package]
name = "sphincs-cycles"
version = "0.1.0"
edition = "2021"
description = "Executes the SP1 guest and reports its cycle count — the proof-generation sizing for the wrap strategy chosen in docs/core/STARK_AIR_GAP_ANALYSIS.md §19."

[dependencies]
sp1-sdk = "6.3.1"
sphincs-m2 = { path = "../../circuits/sphincs-m2" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3

[workspace]
