[package]
name = "fri-alllayer-query-m05"
version = "0.1.0"
edition = "2021"
description = "M0.5-impl method-A binding step (§23): all-layer commitment-bound FRI query verification. §22 (fri-commit-query-m05) bound only the layer-0 entry opening (a0,c0) to the layer-0 Poseidon2 root. This crate applies the same construction to every FRI fold round: each round i's opening pair (a_i,c_i) is glued to a leaf committed under that layer's own root_i, so every opening the fold chain consumes — not just the entry — is provably bound to a per-layer commitment. This is the R-fold repetition named in §22.5: the FRI query is anchored to a committed codeword at each layer, closing the residual 'inner layers asserted, not committed' gap."

