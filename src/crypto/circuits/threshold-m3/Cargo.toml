[package]
name = "threshold-m3"
version = "0.1.0"
edition = "2021"
description = "M3: SPHINCS+ 2/N threshold verification composition — per signer a full SLH-DSA-SHAKE-128s proof composition (M2d) plus a SHA3-256 registry Merkle membership pipeline proof (32-byte chain extension of the M2c/M2d pipeline AIR), with native threshold/dedup/set-commitment checks over public values."

[dependencies]
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "52b9e418813b83d51902cf163cd1d92b015512a3" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "52b9e418813b83d51902cf163cd1d92b015512a3" }
