[package]
name = "sphincs-tree-m2c"
version = "0.1.0"
edition = "2021"
description = "M2c: multi-block SHAKE256 absorption (T_len over 35 WOTS+ pk elements, T_k over 14 FORS roots) via XOR-link bit columns, plus FORS and XMSS Merkle auth-path AIR with direction-bit chaining — fixed 30-permutation SPHINCS+-SHAKE-128s tree pipeline with in-trace glue between adjacent stages and public-table binding of ADRS and rate structure."

[dependencies]
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "52b9e418813b83d51902cf163cd1d92b015512a3" }
