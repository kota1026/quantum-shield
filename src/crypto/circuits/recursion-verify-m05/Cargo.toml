[package]
name = "recursion-verify-m05"
version = "0.1.0"
edition = "2021"
description = "M0.5-impl method-A integration: composes the four recursive-verifier AIRs (Poseidon2 Merkle-opening §16, FRI fold §17, Fiat-Shamir transcript §18, DEEP-ALI §19) into one end-to-end verification of an inner FRI proof. A single runner proves each segment and binds their interfaces by public glue — observed Merkle root -> transcript, squeezed challenges -> fold betas and query index, folded/opened evaluations -> DEEP identity — the same public-glue composition M2d/M3 use, checked natively; cross-segment tampering is rejected."

