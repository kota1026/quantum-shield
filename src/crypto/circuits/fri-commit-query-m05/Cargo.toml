[package]
name = "fri-commit-query-m05"
version = "0.1.0"
edition = "2021"
description = "M0.5-impl method-A binding step: commitment-bound FRI query verification. Composes the §16 Poseidon2 Merkle-opening AIR (proving the FRI layer-0 opening leaf is committed under a fixed root) with the §17 fold-consistency AIR (proving the per-query fold chain) via §20-style public glue: the fold's round-0 opening pair equals the committed Merkle leaf. This converts the fold openings from free public inputs into values provably bound to a commitment root — closing the 'openings asserted, not committed' gap."

