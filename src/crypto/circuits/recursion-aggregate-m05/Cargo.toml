[package]
name = "recursion-aggregate-m05"
version = "0.1.0"
edition = "2021"
description = "M0.5-impl method-A public-surface reduction: an interface-commitment AIR that absorbs the recursive verifier's whole public interface set (the four segments' glue values from §20) into a Poseidon2 sponge and binds a single digest as public output. That digest is the single public input the §14 Groth16 wrap consumes, replacing the multi-proof public surface. SubAirs p3-poseidon2-air over the same BabyBear width-16 permutation."

[dependencies]
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "52b9e418813b83d51902cf163cd1d92b015512a3" }
