[package]
name = "deep-ali-m05"
version = "0.1.0"
edition = "2021"
description = "M0.5-impl method-A component 4 (final): a DEEP-ALI constraint-consistency AIR. Given a random out-of-domain point zeta and the opened trace/quotient evaluations, it verifies the DEEP quotient identity C(t(zeta), t(zeta*g)) = Z_H(zeta) * q(zeta) — computing the vanishing polynomial Z_H(zeta) = zeta^n - 1 via an in-AIR squaring chain and binding openings and quotient to public inputs. The last of method A's four recursive-verifier components."

