[package]
name = "recursion-multiquery-m05"
version = "0.1.0"
edition = "2021"
description = "M0.5-impl method-A recursion step (§24): multi-query openings against a single committed codeword root. §22/§23 verified one opening per fabricated per-layer root; a real FRI layer commits one codeword root and opens ~100 distinct query indices into it. This crate builds a real Poseidon2 Merkle tree over a real codeword vector (bottom-up with the AIR-identical compression), commits one root, and drives the §16 recursion Merkle-opening AIR with K distinct real query openings — every opening's leaf+authentication path proven to hash to the SAME committed root. This is the 'one commitment, many queries' structure a real inner proof's per-layer opening set has, a step past §23's per-opening fabricated roots toward full recursion."

