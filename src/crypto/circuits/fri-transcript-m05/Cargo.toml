[package]
name = "fri-transcript-m05"
version = "0.1.0"
edition = "2021"
description = "M0.5-impl method-A component 3: a Fiat-Shamir transcript-replay AIR. A Poseidon2 duplex sponge (overwrite mode) absorbs the prover's observed commitments round by round and squeezes the round challenges; the AIR binds each squeezed challenge to the public value the FRI folding AIR consumes, so a recursive verifier can derive its own challenges in-circuit instead of trusting the prover. SubAirs p3-poseidon2-air over the same BabyBear width-16 permutation as recursion-merkle-m05."

